<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta name="x-icue-property" data-name="modApiBase" data-label="iCUE HUD Bridge mod URL" data-type="textfield" data-default="http://localhost:27421" />
<meta name="x-icue-property" data-name="hourFormat" data-label="Real clock format (24 or 12)" data-type="textfield" data-default="24" />
<meta name="x-icue-property" data-name="fontScale" data-label="Text size multiplier (1 = default)" data-type="textfield" data-default="1" />
<style>
	html { font-size: 4.4vmin; }
	html, body {
		-webkit-user-select: none;
		user-select: none;
		margin: 0; padding: 0; width: 100%; height: 100%;
		background: #101014; color: #e8e8ec;
		font-family: "Segoe UI", sans-serif;
		overflow: hidden;
	}
	.wrap { box-sizing: border-box; width: 100%; height: 100%; padding: 5% 8%; display: flex; flex-direction: column; justify-content: center; gap: 0.2em; }
	.day { display: flex; align-items: baseline; gap: 0.4em; }
	.day .label { font-size: 1.1em; font-weight: 600; opacity: 0.6; letter-spacing: 0.05em; text-transform: uppercase; }
	.day .num { font-family: "Consolas", "Cascadia Mono", monospace; font-size: 2.6em; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; }
	.line { display: flex; justify-content: space-between; align-items: baseline; font-size: 1em; }
	.line .k { opacity: 0.6; }
	.line .v { font-family: "Consolas", "Cascadia Mono", monospace; font-weight: 600; font-variant-numeric: tabular-nums; }
	.msg { display: none; flex: 1; align-items: center; justify-content: center; text-align: center; font-size: 1.3em; opacity: 0.6; }
	.wrap.msg-mode .day, .wrap.msg-mode .line { display: none; }
	.wrap.msg-mode .msg { display: flex; }
</style>
</head>
<body>
	<div class="wrap" id="wrap">
		<div class="day"><span class="label">Day</span><span class="num" id="day">&#8212;</span></div>
		<div class="line"><span class="k">Session</span><span class="v" id="session"></span></div>
		<div class="line"><span class="k">Real time</span><span class="v" id="clock"></span></div>
		<div class="msg" id="msg">HUD mod not running</div>
	</div>
<script src="jm-api.js"></script>
<script>
	JM.applyFontScale(4.4);
	var twelve = String(window.hourFormat || "24").trim() === "12";
	function setMsg(text) {
		document.getElementById("wrap").classList.toggle("msg-mode", !!text);
		if (text) document.getElementById("msg").textContent = text;
	}
	function pad(n) { return (n < 10 ? "0" : "") + n; }
	function dur(ms) {
		var m = Math.floor(ms / 60000), h = Math.floor(m / 60);
		return h ? h + " h " + pad(m - h * 60) + " min" : m + " min";
	}
	var sessionStart = null;
	function tickClock() {
		var d = new Date(), h = d.getHours(), suffix = "";
		if (twelve) { suffix = h >= 12 ? " pm" : " am"; h = h % 12 || 12; }
		document.getElementById("clock").textContent = h + ":" + pad(d.getMinutes()) + suffix;
		document.getElementById("session").textContent = sessionStart ? dur(Date.now() - sessionStart) : "—";
	}
	function poll() {
		JM.fetchState()
			.then(function (state) {
				if (!state.inGame) { setMsg("Not in a world"); return; }
				var env = state.environment;
				if (!env) { setMsg("Mod update needed"); return; }
				setMsg(null);
				document.getElementById("day").textContent = Math.floor(env.gameTime / 24000) + 1;
				sessionStart = env.sessionStart || null;
				tickClock();
			})
			.catch(function () { setMsg("HUD mod not running"); });
	}
	setMsg("HUD mod not running");
	poll();
	setInterval(poll, 2000);
	setInterval(tickClock, 1000);
</script>
</body>
</html>

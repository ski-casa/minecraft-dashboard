<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta name="x-icue-property" data-name="apiBase" data-label="JourneyMap webmap URL" data-type="textfield" data-default="http://localhost:8080" />
<meta name="x-icue-property" data-name="modApiBase" data-label="iCUE HUD Bridge mod URL" data-type="textfield" data-default="http://localhost:27421" />
<meta name="x-icue-property" data-name="fontScale" data-label="Text size multiplier (1 = default)" data-type="textfield" data-default="1" />
<style>
	html { font-size: 4.4vmin; }
	html, body {
		-webkit-user-select: none;
		user-select: none;
		margin: 0; padding: 0; width: 100%; height: 100%;
		background: #101014; color: #e8e8ec;
		font-family: "Segoe UI", sans-serif;
		overflow: hidden;
	}
	.wrap { box-sizing: border-box; width: 100%; height: 100%; padding: 4% 7% 5%; display: flex; flex-direction: column; gap: 0.3em; }
	.title { font-size: 3.8vw; font-weight: 600; opacity: 0.6; letter-spacing: 0.05em; text-transform: uppercase; display: flex; justify-content: space-between; }
	.title .state { letter-spacing: 0; text-transform: none; }
	.title .state.flying { color: #5ac8fa; opacity: 1; }
	.tiles { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 1fr; grid-auto-rows: 1fr; gap: 0.4em; }
	.tile { display: flex; flex-direction: column; justify-content: center; padding: 0 0.5em; border-radius: 0.4em; background: rgba(255, 255, 255, 0.05); min-width: 0; }
	.tile .k { font-size: 0.8em; opacity: 0.55; text-transform: uppercase; letter-spacing: 0.05em; }
	.tile .v { font-family: "Consolas", "Cascadia Mono", monospace; font-size: 1.5em; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
	.tile .v small { font-size: 0.55em; font-weight: 400; opacity: 0.6; margin-left: 0.2em; }
	.tile .v.warn { color: #ff9f0a; }
	.tile .v.bad { color: #ff453a; }
	.tile .v.up { color: #34c759; }
	.bar { height: 0.35em; border-radius: 0.2em; background: rgba(255, 255, 255, 0.1); margin-top: 0.2em; overflow: hidden; }
	.bar > div { height: 100%; background: #34c759; }
	.bar.warn > div { background: #ff9f0a; }
	.bar.bad > div { background: #ff453a; }
	.msg { display: none; flex: 1; align-items: center; justify-content: center; text-align: center; font-size: 1.3em; opacity: 0.6; }
	.wrap.msg-mode .tiles { display: none; }
	.wrap.msg-mode .msg { display: flex; }
</style>
</head>
<body>
	<div class="wrap" id="wrap">
		<div class="title"><span>Flight</span><span class="state" id="state"></span></div>
		<div class="tiles">
			<div class="tile"><div class="k">Elytra</div><div class="v" id="elytra">&#8212;</div><div class="bar" id="elytraBar"><div></div></div></div>
			<div class="tile"><div class="k">Rockets</div><div class="v" id="rockets">&#8212;</div></div>
			<div class="tile"><div class="k">Altitude</div><div class="v" id="alt">&#8212;</div></div>
			<div class="tile"><div class="k">Speed</div><div class="v" id="speed">&#8212;</div></div>
			<div class="tile"><div class="k">Climb</div><div class="v" id="climb">&#8212;</div></div>
			<div class="tile"><div class="k">Heading</div><div class="v" id="heading">&#8212;</div></div>
		</div>
		<div class="msg" id="msg">HUD mod not running</div>
	</div>
<script src="jm-api.js"></script>
<script>
	JM.applyFontScale(4.4);
	function setMsg(text) {
		document.getElementById("wrap").classList.toggle("msg-mode", !!text);
		if (text) document.getElementById("msg").textContent = text;
	}
	function render(state) {
		var v = state.vitals || {}, eq = state.equipment || {}, chest = eq.chest;
		var el = document.getElementById("elytra"), bar = document.getElementById("elytraBar");
		if (chest && /elytra$/.test(chest.id) && chest.maxDamage) {
			var left = chest.maxDamage - chest.damage, pct = left / chest.maxDamage * 100;
			var cls = pct < 10 ? "bad" : pct < 25 ? "warn" : "";
			el.innerHTML = left + "<small>/" + chest.maxDamage + "</small>";
			el.className = "v " + cls;
			bar.className = "bar " + cls;
			bar.firstChild.style.width = pct + "%";
		} else {
			el.textContent = "not worn";
			el.className = "v warn";
			bar.firstChild.style.width = "0%";
		}
		var rockets = (state.totals && state.totals["minecraft:firework_rocket"]) ? state.totals["minecraft:firework_rocket"].inventory : 0;
		var r = document.getElementById("rockets");
		r.textContent = rockets;
		r.className = "v" + (rockets === 0 ? " bad" : rockets < 8 ? " warn" : "");
		var p = state.player || {};
		document.getElementById("alt").innerHTML = Math.round(p.y) + "<small>y</small>";
		document.getElementById("speed").innerHTML = (v.speed || 0).toFixed(1) + "<small>b/s</small>";
		var c = document.getElementById("climb"), vs = v.verticalSpeed || 0;
		c.innerHTML = (vs > 0 ? "↑" : vs < 0 ? "↓" : "") + Math.abs(vs).toFixed(1) + "<small>b/s</small>";
		c.className = "v" + (vs > 0.5 ? " up" : vs < -8 ? " bad" : "");
		var s = document.getElementById("state");
		s.textContent = v.fallFlying ? "gliding" : "";
		s.className = "state" + (v.fallFlying ? " flying" : "");
	}
	function pollHeading() {
		JM.fetchPlayer().then(function (p) {
			document.getElementById("heading").innerHTML = p.facing + "<small>" + Math.round(((p.heading % 360) + 360) % 360) + "°</small>";
		}).catch(function () {});
	}
	function poll() {
		JM.fetchState()
			.then(function (state) {
				if (!state.inGame) { setMsg("Not in a world"); return; }
				setMsg(null);
				render(state);
			})
			.catch(function () { setMsg("HUD mod not running"); });
	}
	setMsg("HUD mod not running");
	poll(); pollHeading();
	setInterval(poll, 250);
	setInterval(pollHeading, 500);
</script>
</body>
</html>

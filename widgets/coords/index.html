<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta name="x-icue-property" data-name="apiBase" data-label="JourneyMap webmap URL" data-type="textfield" data-default="http://localhost:8080" />
<style>
	html, body {
		margin: 0;
		padding: 0;
		width: 100%;
		height: 100%;
		background: #101014;
		color: #e8e8ec;
		font-family: "Segoe UI", sans-serif;
		overflow: hidden;
	}
	.wrap {
		box-sizing: border-box;
		width: 100%;
		height: 100%;
		padding: 6% 8%;
		display: flex;
		flex-direction: column;
		justify-content: center;
		gap: 4%;
	}
	.axis-row {
		display: flex;
		justify-content: space-between;
		align-items: baseline;
	}
	.axis-label {
		font-size: 1.4em;
		font-weight: 600;
		opacity: 0.6;
		letter-spacing: 0.05em;
	}
	.axis-value {
		font-family: "Consolas", "Cascadia Mono", monospace;
		font-size: 2.4em;
		font-weight: 700;
		font-variant-numeric: tabular-nums;
	}
	.footer {
		display: flex;
		justify-content: space-between;
		font-size: 1.1em;
		opacity: 0.7;
	}
	.offline {
		display: none;
		text-align: center;
		font-size: 1.3em;
		opacity: 0.6;
	}
	.wrap.offline-mode .live { display: none; }
	.wrap.offline-mode .offline { display: block; }
</style>
</head>
<body>
	<div class="wrap" id="wrap">
		<div class="live" id="live">
			<div class="axis-row"><span class="axis-label">X</span><span class="axis-value" id="x">--</span></div>
			<div class="axis-row"><span class="axis-label">Y</span><span class="axis-value" id="y">--</span></div>
			<div class="axis-row"><span class="axis-label">Z</span><span class="axis-value" id="z">--</span></div>
			<div class="footer"><span id="dim">--</span><span id="facing">--</span></div>
		</div>
		<div class="offline" id="offline">Minecraft not running</div>
	</div>
<script src="jm-api.js"></script>
<script>
	function setOffline(isOffline) {
		document.getElementById("wrap").classList.toggle("offline-mode", isOffline);
	}

	function poll() {
		JM.fetchPlayer()
			.then(function (p) {
				setOffline(false);
				document.getElementById("x").textContent = p.x.toFixed(1);
				document.getElementById("y").textContent = p.y.toFixed(1);
				document.getElementById("z").textContent = p.z.toFixed(1);
				document.getElementById("dim").textContent = p.dimensionLabel;
				document.getElementById("facing").textContent = p.facing;
			})
			.catch(function () { setOffline(true); });
	}

	setOffline(true);
	poll();
	setInterval(poll, 500);
</script>
</body>
</html>
